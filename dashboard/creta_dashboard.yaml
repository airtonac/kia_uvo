title: Creta
views:
  - title: Creta
    path: creta
    icon: mdi:car-estate
    badges: []
    cards:
      # ---------- 360 SURROUND VIEW ----------
      - type: vertical-stack
        cards:
          - type: picture-entity
            entity: image.creta_360_surround_view
            name: 360° Surround View
            show_state: false
            show_name: true
            tap_action:
              action: more-info
          - type: horizontal-stack
            cards:
              - type: button
                entity: button.creta_capture_360_view
                name: Capture 360°
                icon: mdi:cctv
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.creta_capture_360_view
              - type: button
                entity: button.creta_force_refresh
                name: Refresh Data
                icon: mdi:refresh
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.creta_force_refresh
          - type: markdown
            content: >
              *360° capture and horn need the car parked with the engine off.*

      # ---------- QUICK CONTROLS ----------
      - type: entities
        title: Controls
        show_header_toggle: false
        entities:
          - entity: lock.creta_door_lock
            name: Doors
          - entity: switch.creta_climate
            name: Climate (remote start)
          - entity: climate.creta_climate_control
            name: Climate settings
          - entity: switch.creta_valet_mode
            name: Valet Mode
          - type: button
            name: Horn & Hazards
            icon: mdi:bullhorn
            action_name: SOUND
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.creta_horn_hazards

      # ---------- WINDOWS ----------
      - type: entities
        title: Windows
        show_header_toggle: false
        entities:
          - entity: cover.creta_front_left_window
            name: Front Left
          - entity: cover.creta_front_right_window
            name: Front Right
          - entity: cover.creta_back_left_window
            name: Back Left
          - entity: cover.creta_back_right_window
            name: Back Right

      # ---------- AT A GLANCE ----------
      - type: glance
        title: Status
        columns: 3
        entities:
          - entity: sensor.creta_fuel_level
            name: Fuel
          - entity: sensor.creta_fuel_driving_range
            name: Range
          - entity: sensor.creta_car_battery_level
            name: 12V Batt
          - entity: binary_sensor.creta_remote_control_available
            name: Remote OK
          - entity: sensor.creta_remote_control_cooldown
            name: Cooldown
          - entity: sensor.creta_last_updated_at
            name: Updated

      # ---------- TRIPS / DISTANCE ----------
      - type: entities
        title: Trips & Distance
        show_header_toggle: false
        entities:
          - entity: sensor.creta_daily_trip_distance
            name: Today
          - entity: sensor.creta_monthly_trip_distance
            name: This Month
          - entity: sensor.creta_connected_services_sim_expiry
            name: Bluelink SIM expiry

      # ---------- LOCATION ----------
      - type: map
        title: Location
        default_zoom: 16
        entities:
          - entity: device_tracker.creta_location

      # ---------- DIAGNOSTICS ----------
      - type: entities
        title: Diagnostics
        show_header_toggle: false
        entities:
          - entity: binary_sensor.creta_engine_oil_warning
            name: Engine Oil
          - entity: binary_sensor.creta_tail_lamp
            name: Tail Lamp
          - entity: binary_sensor.creta_hazard_lights
            name: Hazards
          - entity: binary_sensor.creta_headlamp_status
            name: Headlamps
          - entity: sensor.creta_location_last_updated
            name: Location updated
