<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Creta Surround</title>
  <style>
    html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#0a0e14;
      font-family:-apple-system,Roboto,Arial,sans-serif;}
    #c{width:100vw;height:100vh;display:block;}
    .hud{position:fixed;top:12px;left:16px;color:#e6edf3;text-shadow:0 1px 4px #000;z-index:5;pointer-events:none;}
    .hud .t{font-size:18px;font-weight:800;} .hud .s{font-size:11px;opacity:.7;}
    #msg{position:fixed;bottom:10px;width:100%;text-align:center;color:#8b949e;font-size:11px;z-index:5;pointer-events:none;}
    #cap{position:fixed;top:12px;right:12px;z-index:6;background:rgba(20,28,38,.6);border:1px solid rgba(255,255,255,.18);
      color:#e6edf3;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);}
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud"><div class="t">CRETA SURROUND</div><div class="s">last 360° capture · drag to orbit</div></div>
  <button id="cap">📷 New capture</button>
  <div id="msg">loading…</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const msg = (m)=>document.getElementById('msg').textContent = m;

    const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
    renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0e14);
    const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
    cam.position.set(6,5,7);
    const ctrl = new OrbitControls(cam, renderer.domElement);
    ctrl.target.set(0,0.4,0); ctrl.maxPolarAngle = Math.PI*0.49; ctrl.minDistance=3; ctrl.maxDistance=20;
    ctrl.autoRotate = true; ctrl.autoRotateSpeed = 0.6;
    scene.add(new THREE.AmbientLight(0xffffff,1.1));
    const dl=new THREE.DirectionalLight(0xffffff,1.0); dl.position.set(5,10,5); scene.add(dl);

    // ---- camera calibration (from SVM response) ----
    // installAngle groups [idx, tiltDownDeg, roll, yaw]; atlas order = front,rear,left,right (best guess)
    const D2R=Math.PI/180;
    // pos in meters (approx), tilt from data, heading per side
    const CAMS = [
      // front
      {idx:0, pos:[0,0.75,1.95], headingDeg:0,   tilt:10},
      // rear
      {idx:1, pos:[0,0.95,-1.95], headingDeg:180, tilt:45},
      // left
      {idx:2, pos:[-0.95,1.05,0], headingDeg:90,  tilt:37},
      // right
      {idx:3, pos:[0.95,1.05,0],  headingDeg:-90, tilt:43},
    ];
    const HALF_FOV = 98*D2R; // fisheye half angle (~196 deg)
    const ATLAS_W=4472, FISH_W=960, FISH_H=720;

    function basis(c){
      const h=c.headingDeg*D2R, t=c.tilt*D2R;
      // forward: point outward (heading) and downward (tilt)
      const fwd=new THREE.Vector3(Math.sin(h)*Math.cos(t), -Math.sin(t), Math.cos(h)*Math.cos(t)).normalize();
      const worldUp=new THREE.Vector3(0,1,0);
      const right=new THREE.Vector3().crossVectors(fwd,worldUp).normalize();
      const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
      return {fwd,right,up};
    }
    const U_pos=[],U_fwd=[],U_right=[],U_up=[],U_idx=[];
    CAMS.forEach(c=>{const b=basis(c);
      U_pos.push(new THREE.Vector3(...c.pos)); U_fwd.push(b.fwd); U_right.push(b.right); U_up.push(b.up); U_idx.push(c.idx);});

    const tex = new THREE.TextureLoader();
    // try live capture from HA image entity first, else static still
    function haToken(){ try{const t=JSON.parse(localStorage.getItem('hassTokens'));if(t&&t.access_token)return t.access_token;}catch(e){}
      for(const k of Object.keys(localStorage)){try{const v=JSON.parse(localStorage.getItem(k));if(v&&v.access_token)return v.access_token;}catch(e){}} return null; }

    const mat = new THREE.ShaderMaterial({
      uniforms:{
        atlas:{value:null},
        camPos:{value:U_pos}, camFwd:{value:U_fwd}, camRight:{value:U_right}, camUp:{value:U_up},
        camIdx:{value:U_idx}, halfFov:{value:HALF_FOV}, atlasW:{value:ATLAS_W}, fishW:{value:FISH_W},
      },
      vertexShader:`
        varying vec3 vWorld;
        void main(){ vec4 w=modelMatrix*vec4(position,1.0); vWorld=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
      fragmentShader:`
        precision highp float;
        varying vec3 vWorld;
        uniform sampler2D atlas;
        uniform vec3 camPos[4]; uniform vec3 camFwd[4]; uniform vec3 camRight[4]; uniform vec3 camUp[4];
        uniform float camIdx[4]; uniform float halfFov; uniform float atlasW; uniform float fishW;
        void main(){
          vec3 col=vec3(0.0); float wsum=0.0;
          for(int i=0;i<4;i++){
            vec3 d = normalize(vWorld - camPos[i]);
            float f = dot(d, camFwd[i]);
            if(f < cos(halfFov)) continue;
            float theta = acos(clamp(f,-1.0,1.0));
            float x2 = dot(d, camRight[i]);
            float y2 = dot(d, camUp[i]);
            float az = atan(y2, x2);
            float rn = theta / halfFov;          // 0..1 within fisheye circle
            float iu = 0.5 + 0.5*rn*cos(az);
            float iv = 0.5 + 0.5*rn*sin(az);
            if(iu<0.02||iu>0.98||iv<0.02||iv>0.98) continue;
            float au = (camIdx[i]*fishW + iu*fishW)/atlasW;
            vec3 c = texture2D(atlas, vec2(au, 1.0-iv)).rgb;
            float w = smoothstep(1.0,0.55,rn) * smoothstep(cos(halfFov),0.2,f);
            col += c*w; wsum += w;
          }
          if(wsum<0.001){ gl_FragColor=vec4(0.04,0.05,0.07,1.0); return; }
          gl_FragColor = vec4(col/wsum, 1.0);
        }`,
      side: THREE.DoubleSide,
    });

    // bowl: flat disc that curves up at the rim
    const R=7, seg=96;
    const geo = new THREE.RingGeometry(0.0, R, seg, 24);
    const pos = geo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i), y=pos.getY(i); const r=Math.hypot(x,y);
      const lift = r>3.0 ? Math.pow((r-3.0)/(R-3.0),2.0)*2.5 : 0.0;
      pos.setZ(i, lift);
    }
    geo.computeVertexNormals();
    const bowl = new THREE.Mesh(geo, mat);
    bowl.rotation.x = -Math.PI/2; // ring is in XY -> lay flat (XZ)
    scene.add(bowl);

    function loadAtlas(url, withToken){
      msg('loading camera image…');
      const onload=(t)=>{ t.colorSpace=THREE.SRGBColorSpace; mat.uniforms.atlas.value=t; msg('drag to orbit · scroll to zoom'); };
      if(withToken){
        const tok=haToken();
        fetch(url,{headers:{Authorization:'Bearer '+tok}}).then(r=>r.ok?r.blob():Promise.reject(r.status))
          .then(b=>{const img=new Image(); img.onload=()=>{const t=new THREE.Texture(img);t.needsUpdate=true;onload(t);}; img.src=URL.createObjectURL(b);})
          .catch(()=>tex.load('svm.jpg?'+Date.now(), onload, undefined, ()=>msg('no image yet — tap New capture')));
      } else {
        tex.load(url, onload, undefined, ()=>msg('no image'));
      }
    }
    // image entity content endpoint
    loadAtlas('/api/image_proxy/image.creta_360_surround_view?'+Date.now(), true);

    // car model in the center
    const draco=new DRACOLoader(); draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    const gltf=new GLTFLoader(); gltf.setDRACOLoader(draco);
    gltf.load('creta.glb?v=6',(g)=>{
      const o=g.scene;
      const box=new THREE.Box3().setFromObject(o); const size=new THREE.Vector3(); box.getSize(size);
      const scale=4.3/Math.max(size.x,size.z); o.scale.setScalar(scale);
      const box2=new THREE.Box3().setFromObject(o); const c=new THREE.Vector3(); box2.getCenter(c);
      o.position.set(-c.x, -box2.min.y, -c.z); // sit on ground, centered
      scene.add(o);
    }, undefined, ()=>{/* ignore if model fails */});

    document.getElementById('cap').onclick=async()=>{
      const tok=haToken(); if(!tok){msg('open inside Home Assistant');return;}
      msg('capturing… (engine must be off, ~30s)');
      try{ await fetch('/api/services/button/press',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({entity_id:'button.creta_capture_360_view'})});
        setTimeout(()=>loadAtlas('/api/image_proxy/image.creta_360_surround_view?'+Date.now(), true), 35000);
      }catch(e){ msg('capture failed: '+e.message); }
    };

    addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    (function loop(){requestAnimationFrame(loop); ctrl.update(); renderer.render(scene,cam);})();
  </script>
</body>
</html>
