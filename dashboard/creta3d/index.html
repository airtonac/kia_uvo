<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Creta 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1b2735 0%, #0d1117 70%); }
    model-viewer {
      width: 100%; height: 100%;
      --poster-color: transparent;
      --progress-bar-color: #41bdf5;
    }
    .hud {
      position: absolute; top: 12px; left: 16px;
      font-family: -apple-system, Roboto, Arial, sans-serif;
      color: #e6edf3; pointer-events: none; text-shadow: 0 1px 3px #000;
    }
    .hud .title { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
    .hud .sub { font-size: 12px; opacity: .7; }
    .hint {
      position: absolute; bottom: 10px; width: 100%; text-align: center;
      font-family: -apple-system, Roboto, Arial, sans-serif;
      color: #8b949e; font-size: 11px; pointer-events: none;
    }
  </style>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer
    src="creta.glb?v=2"
    alt="Hyundai Creta 3D model"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="500"
    rotation-per-second="18deg"
    interaction-prompt="none"
    shadow-intensity="1.2"
    shadow-softness="0.8"
    exposure="1.05"
    environment-image="neutral"
    camera-orbit="40deg 72deg 105%"
    min-camera-orbit="auto auto 60%"
    max-camera-orbit="auto auto 160%"
    field-of-view="30deg">
    <div class="hud">
      <div class="title">HYUNDAI CRETA</div>
      <div class="sub">Platinum &middot; Live in Home Assistant</div>
    </div>
    <div class="hint">drag to rotate &middot; pinch / scroll to zoom</div>
  </model-viewer>
</body>
</html>
